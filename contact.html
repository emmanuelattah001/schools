<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/campus-new-contact_styles.css">
    <title> contact</title>
</head>

<body>
    <!-- header section -->
    <section class="header_section" id="header_section">
        <div id="nav" class="nav">

        </div>

        <!-- hero section -->
        <div class="header_section">
            <div class="about_hero">
                <div class="about_text">
                    <div>
                        <h1>What you need to know about emmy uni</h1>
                        <p>
                            here are what you need to know about emmy university for Now.
                            i hope to see you there so you can explore more about emmy university
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="contact-grid">
        <div class="contact-info">
            <h3>Get in Touch</h3>
            <p><strong>Address:</strong> Emmy University, Akure, Nigeria</p>
            <p><strong>Email:</strong> info@emmyuni.edu</p>
            <p><strong>Phone:</strong> +234 800 123 4567</p>
        </div>

        <div class="contact-form">
            <h3>Send a Message</h3>
            <form>
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>
    </section>

    <section class="map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!..." width="100%" height="400" style="border:0;"
            allowfullscreen="">
        </iframe>
    </section>

    <div id="footer"></div>
    <script src="./js/script.js"></script>
</body>

</html>
